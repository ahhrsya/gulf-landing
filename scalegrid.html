<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scale Grid — scroll zoom section</title>
<style>
  :root{ color-scheme: light }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:#111;font:16px/1.5 ui-sans-serif,system-ui,sans-serif}
  .spacer{min-height:60vh;display:grid;place-items:center;padding:4rem 1.5rem;text-align:center}

  /* ---------------- SCALE GRID ---------------- */
  .scale-grid{ padding:0 1.25rem }
  .scale-grid-wrap{ position:relative; overflow:hidden }
  .scale-grid-content{ display:grid; gap:1rem }
  .scale-grid-item{ position:relative; overflow:hidden; background:#111; aspect-ratio:3/2 }
  .scale-grid-item img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block }

  @media (min-width:650px){
    .scale-grid{
      /* 1em drives the whole collage. Cap by height so it never blows past the viewport. */
      font-size:min(0.5625vw, 0.88vh);
      height:400vh;                 /* scroll distance of the effect */
      padding:0;
    }
    .scale-grid-wrap{ position:sticky; top:0; height:100svh }
    .scale-grid-content{
      display:block; gap:0;
      position:absolute; top:50%; left:50%;
      width:129.6em; height:127.8em;
      transform:translate(-50%,-50%) scale(var(--s,1));
      will-change:transform;
    }
    .scale-grid-item{ position:absolute; aspect-ratio:auto }
    .scale-grid-item:nth-child(1){ top:0;        left:32.9em;  width:77em;   height:41.2em }
    .scale-grid-item:nth-child(2){ top:50.3em;   left:0;       width:30.9em; height:34.1em }
    .scale-grid-item:nth-child(3){ top:43.2em;   left:32.9em;  width:63.8em; height:41.2em }
    .scale-grid-item:nth-child(4){ top:50.3em;   right:0;      width:30.9em; height:34.1em }
    .scale-grid-item:nth-child(5){ bottom:12.6em;left:6.6em;   width:37.5em; height:28.8em }
    .scale-grid-item:nth-child(6){ bottom:0;     left:46.1em;  width:63.8em; height:41.2em }
    /* hero photo un-crops (1.5 -> 1) as the collage zooms in */
    .scale-grid-item:nth-child(3) img{ transform:scale(var(--img,1.5)) }
  }
  @media (prefers-reduced-motion:reduce){
    .scale-grid{height:auto}
    .scale-grid-wrap{position:static;height:auto}
  }
</style>
</head>
<body>

<div class="spacer"><p>Scroll down.</p></div>

<!-- ===== component: swap the 6 image srcs. #3 is the hero the grid zooms into. ===== -->
<section class="scale-grid js-scale-grid">
  <div class="scale-grid-wrap">
    <div class="scale-grid-content js-scale">
      <div class="scale-grid-item"><img src="https://picsum.photos/id/1018/1600/900" alt=""></div>
      <div class="scale-grid-item"><img src="https://picsum.photos/id/1040/900/1000" alt=""></div>
      <div class="scale-grid-item js-scale-ref"><img src="https://picsum.photos/id/1015/2400/1600" alt=""></div>
      <div class="scale-grid-item"><img src="https://picsum.photos/id/1043/900/1000" alt=""></div>
      <div class="scale-grid-item"><img src="https://picsum.photos/id/1011/1200/900" alt=""></div>
      <div class="scale-grid-item"><img src="https://picsum.photos/id/1024/1600/1000" alt=""></div>
    </div>
  </div>
</section>

<div class="spacer"><p>Next section.</p></div>

<script>
document.querySelectorAll('.js-scale-grid').forEach(root => {
  const content = root.querySelector('.js-scale');
  const ref = root.querySelector('.js-scale-ref');
  const HOLD_IN = 0.26, RUN = 0.53;          // dwell zoomed-out, then zoom over 53% of the scroll
  let cur = 0, max = 1, running = false;
  const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;

  const measure = () => {
    const r = ref.getBoundingClientRect(), s = cur ? 1 + cur * (max - 1) : 1;
    max = Math.max(innerWidth / (r.width / s), innerHeight / (r.height / s)); // hero covers viewport
  };

  const frame = () => {
    const box = root.getBoundingClientRect();
    const raw = clamp(-box.top / (root.offsetHeight - innerHeight));
    const target = clamp((raw - HOLD_IN) / RUN);
    cur += (target - cur) * 0.12;                                  // smoothing
    if (Math.abs(target - cur) < 0.0005) cur = target;
    content.style.setProperty('--s', 1 + cur * (max - 1));
    content.style.setProperty('--img', 1.5 - 0.5 * cur);
    running = Math.abs(target - cur) > 0.0001 || (box.top < innerHeight && box.bottom > 0);
    if (running) requestAnimationFrame(frame); 
  };
  const kick = () => { if (!running) { running = true; requestAnimationFrame(frame); } };

  if (matchMedia('(min-width:650px)').matches && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
    addEventListener('resize', () => { measure(); kick(); });
    addEventListener('scroll', kick, { passive: true });
    measure(); kick();
  }
});
</script>
</body>
</html>
